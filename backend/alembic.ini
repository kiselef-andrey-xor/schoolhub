# Конфигурация Alembic (v1.3+). Обычный запуск из папки backend:
#   alembic upgrade head                          — применить миграции
#   alembic revision --autogenerate -m "описание" — сгенерировать новую
# Приложение при старте применяет миграции само (AUTO_MIGRATE=true),
# поэтому на NAS никаких ручных команд выполнять не нужно.

[alembic]
script_location = alembic
prepend_sys_path = .
# URL берётся из ENV DATABASE_URL (см. alembic/env.py); sqlalchemy.url здесь не задаётся.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
